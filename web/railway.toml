# Railway deployment config for the Envy marketing site.
#
# Set the Railway service's "Root Directory" to `web/` in the dashboard, then
# the Nixpacks builder picks up `composer.json` here and provisions PHP 8.2
# automatically. The custom `nixpacksConfigPath` keeps any future PHP-specific
# overrides scoped to this directory rather than the repo root.

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
# PHP's built-in server is good enough for a static-ish marketing site that
# serves at most a few hundred RPS. If we ever need more, swap this start
# command for a Caddyfile or php-fpm + nginx setup.
#
# Wrapped in `sh -c` so `$PORT` is expanded by a shell — Railway runs this
# start command directly (no implicit shell), so an unwrapped `$PORT` reaches
# php as a literal string and it dies with "Invalid address: 0.0.0.0:$PORT".
# `${PORT:-8080}` falls back to 8080 if Railway doesn't inject PORT.
startCommand = "sh -c 'php -S 0.0.0.0:${PORT:-8080} -t public public/index.php'"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

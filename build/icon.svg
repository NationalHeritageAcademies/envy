<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#10241b"/>
      <stop offset="55%" stop-color="#0b1310"/>
      <stop offset="100%" stop-color="#070a09"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="40%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#aef7d6"/>
      <stop offset="52%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0b7a54"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="380" fill="url(#halo)"/>

  <!-- Eye, scaled from the 40-unit brand mark (translate 192,180; scale 16) -->

<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="85%">
      <stop offset="0%" stop-color="#10241b"/>
      <stop offset="55%" stop-color="#0b1310"/>
      <stop offset="100%" stop-color="#070a09"/>
    </radialGradient>
    <radialGradient id="haloL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eafff5"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="660" height="400" fill="url(#bg)"/>
  <circle cx="165" cy="232" r="240" fill="url(#haloL)"/>

  <!-- Brand mark: the Envy eye, small, top-left of the title -->
  <g transform="translate(250,52) scale(1.5)">
    <circle cx="20" cy="20" r="18.5" fill="#34d399" opacity="0.18"/>
    <circle cx="20" cy="20" r="11.5" fill="#34d399"/>
    <circle cx="20" cy="20" r="4.7" fill="#04130c"/>
    <circle cx="16.6" cy="16.4" r="1.8" fill="#eafff5" opacity="0.92"/>
  </g>

  <text x="306" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" fill="url(#title)">Envy</text>
  <text x="330" y="132" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#9fb6ab"
        letter-spacing="0.3">Drag Envy into your Applications folder to install</text>

  <!-- Icon framing slots: app icon (left) and Applications (right) -->
  <rect x="105" y="180" width="120" height="120" rx="26" fill="#ffffff" opacity="0.03"/>
  <rect x="435" y="180" width="120" height="120" rx="26" fill="#ffffff" opacity="0.03"/>

  <!-- Arrow from app toward Applications -->
  <g transform="translate(0,240)">
    <rect x="258" y="-5" width="120" height="10" rx="5" fill="url(#arrow)"/>
    <path d="M 378 -16 L 406 0 L 378 16 Z" fill="#34d399"/>
  </g>

  <text x="330" y="356" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="500" fill="#4f6b5f"
        letter-spacing="1.5">NATIONAL HERITAGE ACADEMIES</text>
</svg>
